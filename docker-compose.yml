services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rss
      POSTGRES_PASSWORD: rss
      POSTGRES_DB: rss_reader
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rss']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/1
    depends_on:
      - redis
    ports:
      - '1200:1200'

  migrate:
    build: ./backend
    entrypoint: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://rss:rss@postgres:5432/rss_reader
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: ./backend
    restart: unless-stopped
    command: ['node', 'dist/server.js']
    environment:
      DATABASE_URL: postgresql://rss:rss@postgres:5432/rss_reader
      REDIS_URL: redis://redis:6379
      PORT: 3001
      INSTAGRAM_BRIDGE_INSTANCES: http://rsshub:1200
      TIKTOK_BRIDGE_INSTANCES: http://rsshub:1200
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    restart: unless-stopped
    command: ['node', 'dist/modules/queue/worker.js']
    environment:
      DATABASE_URL: postgresql://rss:rss@postgres:5432/rss_reader
      REDIS_URL: redis://redis:6379
      FEED_UPDATE_THREADS: 4
      INSTAGRAM_BRIDGE_INSTANCES: http://rsshub:1200
      TIKTOK_BRIDGE_INSTANCES: http://rsshub:1200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - app

volumes:
  postgres-data:
  redis-data:
