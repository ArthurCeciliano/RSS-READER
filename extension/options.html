<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>RSS Reader - Instagram Bridge</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #16161c;
        color: #e4e4e7;
        padding: 24px;
        max-width: 480px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 16px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #a1a1aa;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 14px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #1f1f27;
        border: 1px solid #333340;
        color: #e4e4e7;
        border-radius: 5px;
        padding: 8px 10px;
        font-size: 13px;
      }
      button {
        margin-top: 18px;
        background: #6d5ce7;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 9px 18px;
        font-size: 13px;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        font-size: 12.5px;
      }
      #status.ok {
        color: #4ade80;
      }
      #status.error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <h1>RSS Reader - Instagram Bridge</h1>
    <label for="apiBaseUrl">URL da API (Configurações → Extensão do navegador no seu RSS Reader)</label>
    <input id="apiBaseUrl" type="text" placeholder="http://179.197.226.119:3001" />

    <label for="apiToken">Token</label>
    <input id="apiToken" type="text" placeholder="cole o token daqui" />

    <label for="syncIntervalMinutes">Intervalo de sincronização (minutos)</label>
    <input id="syncIntervalMinutes" type="number" min="15" value="25" />

    <button id="save">Salvar</button>
    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
