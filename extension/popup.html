<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>RSS Reader - Instagram Bridge</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #16161c;
        color: #e4e4e7;
        width: 300px;
        padding: 14px;
        margin: 0;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 10px;
      }
      #status {
        font-size: 12.5px;
        border-radius: 6px;
        padding: 8px 10px;
      }
      #status.ok {
        background: #14261a;
        color: #4ade80;
      }
      #status.error {
        background: #2a1a1a;
        color: #f87171;
      }
      .note {
        margin-top: 12px;
        font-size: 11.5px;
        color: #a1a1aa;
        line-height: 1.55;
      }
      a {
        color: #a1a1ff;
      }
    </style>
  </head>
  <body>
    <h1>RSS Reader - Instagram Bridge</h1>
    <div id="status">verificando…</div>
    <p class="note">
      A sincronização é feita <strong>dentro do app</strong>: passe o mouse sobre um perfil de
      Instagram ou sobre uma pasta com perfis e clique no botão <strong>⟳</strong>. Não há mais
      atualização automática.
    </p>
    <p class="note"><a href="options.html" target="_blank">Configurar conexão (URL + token)</a></p>
    <script src="popup.js"></script>
  </body>
</html>
